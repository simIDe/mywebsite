role = "data engineer · Cévennes, France"

abstract_label = "Abstract"
abstract_body = """Data engineer. I came to data during my PhD, trying to process human movement recordings that were too large and too messy for the tools I had — and that problem turned out to interest me more than the research question itself. Since then I have moved one step upstream at every stage: from analysis to data, from data to infrastructure, from infrastructure to how organisations actually work. Since late 2026 I have been building IOTA, in the Cévennes."""

keywords_label = "Keywords"
keywords = "data engineering · automation · systems · applied AI · biomechanics · Cévennes"

# 1. Position
s1_title = "Position"
s1_p1 = """A biomechanics PhD produces messy data. Drifting sensors, noise, artefacts, volumes that will not fit through the lab’s tools. I spent a great deal of time building what was needed to process it, and realised that this work interested me more than the research subject."""
s1_p2 = """It never stopped. At a consultancy, the models were waiting for the data to become usable. In a small company, the analysis was waiting for an infrastructure to exist — you cannot do data science before doing the data engineering. Today, automation is waiting for someone to understand how the organisation really runs."""
s1_p3 = """What I like, underneath all of it, is building systems: code, automation, organisations that run properly."""

pullquote = "All automation is data manipulation."


# 3. Method
s3_title = "Method"
s3_intro = "These rules come from practice. Mostly they exist to stop me from building too early."
rule_1 = "A request is not a problem."
rule_2 = "A tool is never a goal."
rule_3 = "No solution before understanding the real process."
rule_4 = "Any problem worth solving has a measurable consequence."
rule_5 = "Remove before automating."
rule_6 = "The simplest solution that works wins."
rule_7 = "Concluding that nothing should be built is a valid outcome."

ladder_intro = "The solution space, in order. Stop at the first rung that holds."
ladder_1 = "remove"
ladder_2 = "change the process"
ladder_3 = "standardise"
ladder_4 = "give them a tool"
ladder_5 = "automate"
ladder_6 = "data / AI"

s3_8_title = "Deciding under uncertainty"
s3_8_body = """A good decision can produce a bad outcome. So I look less for the decision that guarantees success than for the one that maximises the odds given what I know. In practice: know my maximum loss, prefer what is reversible, and test small before committing."""


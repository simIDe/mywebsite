role = "data engineer · Cévennes, France"

abstract_label = "Résumé"
abstract_body = """Data engineer. J’ai découvert la donnée pendant ma thèse, en essayant de traiter des mesures de mouvement humain trop volumineuses et trop sales pour les outils dont je disposais — et ce problème m’a intéressé plus que la question de recherche elle-même. Depuis, je suis remonté d’un cran à chaque étape : de l’analyse vers la donnée, de la donnée vers l’infrastructure, de l’infrastructure vers le fonctionnement des organisations. Depuis fin 2026, je cofonde IOTA, dans les Cévennes."""

keywords_label = "Mots-clés"
keywords = "data engineering · automatisation · systèmes · IA appliquée · biomécanique · Cévennes"

# 1. Position
s1_title = "Position"
s1_p1 = """Une thèse en biomécanique produit des données sales. Des capteurs qui dérivent, du bruit, des artefacts, des volumes qui ne tiennent pas dans les outils du laboratoire. J’ai passé beaucoup de temps à construire de quoi les traiter, et je me suis aperçu que ce travail m’intéressait plus que le sujet de recherche."""
s1_p2 = """Ça ne s’est jamais arrêté. En ESN, les modèles attendaient que la donnée soit exploitable. Dans une PME, l’analyse attendait qu’une infrastructure existe — on ne fait pas de data science sans avoir fait le data engineering d’abord. Aujourd’hui, l’automatisation attend qu’on ait compris comment l’organisation fonctionne vraiment."""
s1_p3 = """Ce que j’aime, au fond, c’est construire des systèmes : du code, de l’automatisation, des organisations qui tournent correctement. J’aime les organisations bien rangées ; je ne suis pas moi-même très rangé."""

pullquote = "Toute automatisation, c’est de la manipulation de données."

